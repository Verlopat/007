[workspace]
members = [
  "crates/types",
  "crates/metrics",
  "crates/pq-mpc-core",
  "crates/mpc-node",
  "crates/sim-harness"
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
authors = ["you"]

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
hdrhistogram = "7"
rand = "0.8"
rand_chacha = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
